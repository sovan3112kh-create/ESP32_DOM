<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ESP32 Relay Control Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0 10px 40px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      color: #ffffff;

      /* Full background image */
      background-image: url('thumb-1920-1350069.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    h1 {
      margin-top: 30px;
      font-size: 2rem;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    .subtitle {
      color: #e0d0f0;
      margin-top: -6px;
      margin-bottom: 20px;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .relay-card {
      display: inline-block;
      background-color: rgba(255, 255, 255, 0.15);
      padding: 20px;
      margin: 15px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      width: 220px;
      vertical-align: top;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .relay-card h2 {
      margin-bottom: 10px;
      font-size: 1.3rem;
      color: #fff;
    }
    .relay-card p {
      margin-bottom: 10px;
      font-size: 1rem;
      color: #f0f0f0;
    }
    .relay-card button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      color: white;
      background-color: #8a2be2;
      cursor: pointer;
      font-size: 16px;
      width: 90%;
      transition: all 0.3s ease;
    }
    .relay-card button:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
    #allOffBtn, #logoutBtn {
      max-width: 300px;
      width: 90%;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 15px auto;
      display: block;
      color: white;
      transition: opacity 0.3s ease;
    }
    #allOffBtn {
      background-color: #d32f2f;
    }
    #allOffBtn:hover {
      opacity: 0.8;
    }
    #logoutBtn {
      background-color: #4a4a4a;
    }
    #logoutBtn:hover {
      opacity: 0.8;
    }

    #dashboard {
      display: none;
      position: relative;
      z-index: 1;
    }
    #loginForm {
      max-width: 400px;
      margin: 80px auto 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
    }
    #loginForm input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 20px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      box-sizing: border-box;
      outline-offset: 2px;
      transition: border-color 0.3s ease;
    }
    #loginForm input:focus {
      border-color: #ba68c8;
      background: #ffffff;
    }
    #loginForm button {
      width: 100%;
      background-color: #8a2be2;
      color: white;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #loginForm button:hover {
      background-color: #7b1fa2;
    }
    #dashboard .relay-container {
      max-width: 960px;
      margin: 20px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ESP32 relay board illustration */
    .board-wrap {
      position: fixed;
      right: 24px;
      bottom: 40px;
      width: 300px;
      max-width: 34vw;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }
    .board-wrap svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4));
    }
    @media (max-width: 700px) {
      .board-wrap {
        width: 170px;
        max-width: 42vw;
        right: 8px;
        bottom: 10px;
        opacity: 0.55;
      }
    }

    /* Person photo, framed */
    .person-photo-wrap {
      position: fixed;
      left: 24px;
      bottom: 0;
      width: 220px;
      max-width: 30vw;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }
    .person-photo-wrap img {
      width: 100%;
      display: block;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 3px solid rgba(255,255,255,0.4);
      border-bottom: none;
    }

    @media (max-width: 700px) {
      .relay-card {
        width: 90%;
        margin: 10px auto;
        display: block;
      }
      body {
        padding: 0 10px 60px;
      }
      .person-photo-wrap {
        width: 130px;
        max-width: 38vw;
        left: 10px;
        opacity: 0.5;
      }
    }

    footer {
      font-size: 0.9rem;
      color: #e0d0f0;
      padding: 10px 0;
      margin-top: 40px;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <h1>ESP32 Relay Control Dashboard</h1>
  <div class="subtitle">Control &bull; Monitor &bull; Automate</div>

  <!-- Decorative photo, bottom-left -->
  <div class="person-photo-wrap">
    <img src="assets/person.png" alt="" />
  </div>

  <!-- Decorative ESP32 relay board illustration, bottom-right -->
  <div class="board-wrap">
    <svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="150" cy="320" rx="110" ry="14" fill="#bcd8f5" opacity="0.4"/>
      <ellipse cx="150" cy="320" rx="70" ry="8" fill="#eaf3fc"/>
      <ellipse cx="150" cy="316" rx="140" ry="1.5" fill="none" stroke="#7fb8ec" stroke-width="1" opacity="0.5"/>
      <ellipse cx="150" cy="308" rx="150" ry="2" fill="none" stroke="#7fb8ec" stroke-width="1" opacity="0.35"/>

      <rect x="30" y="20" width="150" height="260" rx="10" fill="#1a2233" stroke="#0d1420" stroke-width="2"/>

      <rect x="45" y="60" width="55" height="55" rx="4" fill="#2b3550" stroke="#4a5a80" stroke-width="1.5"/>
      <text x="72" y="92" text-anchor="middle" font-family="Arial" font-size="11" fill="#cfe0ff" font-weight="bold">ESP32</text>

      <g fill="#d7b23a">
        <rect x="40" y="26" width="6" height="10"/>
        <rect x="52" y="26" width="6" height="10"/>
        <rect x="64" y="26" width="6" height="10"/>
        <rect x="76" y="26" width="6" height="10"/>
        <rect x="88" y="26" width="6" height="10"/>
        <rect x="100" y="26" width="6" height="10"/>
        <rect x="112" y="26" width="6" height="10"/>
        <rect x="124" y="26" width="6" height="10"/>
      </g>

      <rect x="45" y="130" width="55" height="30" rx="3" fill="#2b3550" stroke="#4a5a80" stroke-width="1.5"/>
      <text x="72" y="238" text-anchor="middle" font-family="Arial" font-size="10" fill="#8ea3c9">ESP32</text>

      <g font-family="Arial" font-size="7.5" fill="#dbe6f5">
        <rect x="110" y="35" width="60" height="48" rx="4" fill="#1f3a63" stroke="#3f6aa8" stroke-width="1.2"/>
        <circle cx="120" cy="45" r="3" fill="#ff5c5c"/>
        <text x="140" y="48" text-anchor="middle">RELAY</text>
        <rect x="118" y="60" width="44" height="14" rx="2" fill="#173058"/>

        <rect x="110" y="90" width="60" height="48" rx="4" fill="#1f3a63" stroke="#3f6aa8" stroke-width="1.2"/>
        <circle cx="120" cy="100" r="3" fill="#4ade80"/>
        <text x="140" y="103" text-anchor="middle">RELAY</text>
        <rect x="118" y="115" width="44" height="14" rx="2" fill="#173058"/>

        <rect x="110" y="145" width="60" height="48" rx="4" fill="#1f3a63" stroke="#3f6aa8" stroke-width="1.2"/>
        <circle cx="120" cy="155" r="3" fill="#ff5c5c"/>
        <text x="140" y="158" text-anchor="middle">RELAY</text>
        <rect x="118" y="170" width="44" height="14" rx="2" fill="#173058"/>

        <rect x="110" y="200" width="60" height="48" rx="4" fill="#1f3a63" stroke="#3f6aa8" stroke-width="1.2"/>
        <circle cx="120" cy="210" r="3" fill="#4ade80"/>
        <text x="140" y="213" text-anchor="middle">RELAY</text>
        <rect x="118" y="225" width="44" height="14" rx="2" fill="#173058"/>
      </g>

      <g stroke="#7fb8ec" stroke-width="1.5" fill="none" opacity="0.8">
        <line x1="180" y1="59" x2="230" y2="59"/>
        <line x1="180" y1="114" x2="230" y2="114"/>
        <line x1="180" y1="169" x2="230" y2="169"/>
        <line x1="180" y1="224" x2="230" y2="224"/>
      </g>
      <g fill="#7fb8ec">
        <circle cx="181" cy="59" r="2.5"/>
        <circle cx="181" cy="114" r="2.5"/>
        <circle cx="181" cy="169" r="2.5"/>
        <circle cx="181" cy="224" r="2.5"/>
      </g>
      <g font-family="Arial" font-size="12" fill="#ffffff" font-weight="bold">
        <text x="234" y="63">RELAY1</text>
        <text x="234" y="118">RELAY2</text>
        <text x="234" y="173">RELAY3</text>
        <text x="234" y="228">RELAY4</text>
      </g>
    </svg>
  </div>

  <!-- Login form -->
  <div id="loginForm">
    <input type="email" id="email" placeholder="Enter Email" required />
    <input type="password" id="password" placeholder="Enter Password" required />
    <button id="loginBtn">Login</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="relay-container">
      <div class="relay-card">
        <h2>Relay 1</h2>
        <p>Status: <span id="status1">Loading...</span></p>
        <button id="btn1">Toggle</button>
      </div>

      <div class="relay-card">
        <h2>Relay 2</h2>
        <p>Status: <span id="status2">Loading...</span></p>
        <button id="btn2">Toggle</button>
      </div>

      <div class="relay-card">
        <h2>Relay 3</h2>
        <p>Status: <span id="status3">Loading...</span></p>
        <button id="btn3">Toggle</button>
      </div>

      <div class="relay-card">
        <h2>Relay 4</h2>
        <p>Status: <span id="status4">Loading...</span></p>
        <button id="btn4">Toggle</button>
      </div>
    </div>

    <button id="allOffBtn">All OFF</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <footer>
    Created by Tech StudyCell
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDyUu2RQfqWNVKc6FXoKX7SeoBHkYuwWHQ",
      authDomain: "esp32-relay-control-01-72dcf.firebaseapp.com",
      databaseURL: "https://esp32-relay-control-01-72dcf-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esp32-relay-control-01-72dcf",
      storageBucket: "esp32-relay-control-01-72dcf.firebasestorage.app",
      messagingSenderId: "750239390882",
      appId: "1:750239390882:web:2ecc8b36ac34d28dd98bfb"
    };

    firebase.initializeApp(firebaseConfig);

    const allowedEmail = "tdom@gmail.com";
    const allowedPassword = "31122005";

    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }

      if(email === allowedEmail && password === allowedPassword){
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(userCredential => {
            console.log("Signed in as", userCredential.user.email);
            loginForm.style.display = "none";
            dashboard.style.display = "block";
            startRelayControl();
          })
          .catch(error => {
            alert("Firebase login failed: " + error.message);
          });
      } else {
        alert("Invalid email or password.");
      }
    });

    function startRelayControl() {
      const db = firebase.database();

      const relays = [
        { id: 1, path: "relay1" },
        { id: 2, path: "relay2" },
        { id: 3, path: "relay3" },
        { id: 4, path: "relay4" },
      ];

      relays.forEach(relay => {
        const statusText = document.getElementById(`status${relay.id}`);
        const toggleButton = document.getElementById(`btn${relay.id}`);
        const relayRef = db.ref("/" + relay.path);

        relayRef.on("value", (snapshot) => {
          const state = snapshot.val();
          statusText.innerText = state ? "ON" : "OFF";
          toggleButton.style.backgroundColor = state ? "#2e7d32" : "#8a2be2";
        });

        toggleButton.onclick = () => {
          relayRef.get().then(snap => {
            relayRef.set(!snap.val());
          });
        };
      });

      document.getElementById("allOffBtn").onclick = () => {
        relays.forEach(relay => {
          db.ref("/" + relay.path).set(false);
        });
      };
    }

    document.getElementById("logoutBtn").onclick = () => {
      firebase.auth().signOut()
        .then(() => {
          dashboard.style.display = "none";
          loginForm.style.display = "block";
          document.getElementById("email").value = "";
          document.getElementById("password").value = "";
        })
        .catch(error => {
          alert("Logout failed: " + error.message);
        });
    };
  </script>
</body>
</html>
